{% extends "base.html" %}
{% block content %}
{% include "includes/pharmacy_nav.html" %}
<div class="page-head">
  <div>
    <h2>{{ page_title }}</h2>
    <p class="schema-line"><code>MEDICINE(medicine_id, name, category, unit_price, stock_qty, expiry_date)</code></p>
  </div>
</div>
<div class="panel panel-pad" style="max-width:720px;">
  {% if errors %}
  <div class="alert alert-danger"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>
  {% endif %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" name="name" value="{{ form.name }}" required>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="category">Category</label>
        <input class="form-control" id="category" name="category" value="{{ form.category }}" required>
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label" for="unit_price">Unit price (₹)</label>
        <input class="form-control" id="unit_price" name="unit_price" inputmode="numeric" value="{{ form.unit_price }}" required>
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label" for="stock_qty">Stock</label>
        <input class="form-control" id="stock_qty" name="stock_qty" inputmode="numeric" value="{{ form.stock_qty }}" required>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="expiry_date">Expiry date</label>
      <input class="form-control" type="date" id="expiry_date" name="expiry_date" value="{{ form.expiry_date }}" required>
    </div>
    <button class="btn btn-teal" type="submit">Save medicine</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('medicine_list') }}">Cancel</a>
  </form>
</div>
{% endblock %}
